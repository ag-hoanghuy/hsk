services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hsk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hsk_dev}
      POSTGRES_DB: ${POSTGRES_DB:-hsk}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5441:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hsk} -d ${POSTGRES_DB:-hsk}"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-hsk}:${POSTGRES_PASSWORD:-hsk_dev}@db:5432/${POSTGRES_DB:-hsk}
      CONTENT_DIR: /content
      AUDIO_DIR: /audio
      MODEL_DIR: /models
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
    volumes:
      - ./backend:/app
      - ./content:/content
      - ./audio:/audio
      - ./models:/models
      - ./tools:/tools
      - ./docs:/docs
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
